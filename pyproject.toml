[build-system]
requires = ["setuptools>=66", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cdmx-bayesopt"
version = "0.5.2"
description = "RGB sensor Bayesian optimization for the CDMX Radxa workshop"
readme = "README.en.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Matter Lab"}]
dependencies = ["numpy>=1.24,<3"]

[project.optional-dependencies]
visual = ["matplotlib>=3.7,<4", "Pillow>=10,<13"]
hardware = ["smbus2>=0.5,<1", "spidev>=3.6,<4"]
dev = []

[project.scripts]
cdmx-bayesopt = "utils.cli:main"
cdmx-color-lab = "web.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"web" = ["*.html"]
